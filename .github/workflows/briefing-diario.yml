name: Briefing diário

on:
  schedule:
    - cron: "30 9 * * *"   # 09:30 UTC = 06:30 em Brasília (sem horário de verão)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/entrada_manual.json", "config/fontes.json", "scripts/**", "index.html"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    outputs:
      rc: ${{ steps.coleta.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes das regras de auditoria
        run: python3 -m unittest discover -s tests -v
      - name: Coletar dados oficiais
        id: coleta
        run: |
          set +e
          python3 scripts/coletar_dados.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Registrar dados e trilha de auditoria
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/briefing.json data/auditoria data/historico_manual.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "sem mudanças"; else
            git commit -m "dados: briefing $(date -u +%F)" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Montar site (somente arquivos públicos)
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/briefing.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Falhar se nenhuma fonte automática respondeu
        if: steps.coleta.outputs.rc != '0'
        run: |
          echo "Coletor retornou código ${{ steps.coleta.outputs.rc }}. Veja o log do passo anterior."
          exit 1

  publicar:
    needs: coletar
    if: always() && needs.coletar.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
